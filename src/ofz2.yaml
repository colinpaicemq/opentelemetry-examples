exporters:
  debug:
    verbosity: normal # basic: basic, normal, detailed
  otlp_http/2:
    endpoint: "http://py:4000"
    encoding: json
    tls:
      insecure: true
#  otlp_http/graf:
#    endpoint: "http://grafana:4001"
#    encoding: json
#    tls:
#      insecure: true
  otlp_http:
    endpoint: "http://jaeger2:4318" # was 4318
    tls:
      insecure: true
  file/b:
      path: /b.file 
  file/in:
      path: /file.in     
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 5m
#  prometheus_remote_write: 
#    endpoint: http://prometheus:9090/api/v1/write
#    target_info:
#      enabled: true
#  prometheus/g:
#    endpoint: "grafana:4001"
#    send_timestamps: true
#    metric_expiration: 5m  
          
connectors:
  count:
  span_metrics:
    metrics_flush_interval: 10s
    histogram:
       explicit:
#        buckets: [100us, 500us, 1ms,2ms, 3ms, 5m, 10ms, 22ms, 100ms]
         buckets: [100us, 500us, 1ms,2ms,3ms,5ms,10ms]
#       exponential: 
    dimensions:
#      - name: http.method
#        default: GET?
#      - name: http.status_code
#      - name: host.name
      - name: w3.tracestate
#      - name: messaging.destination.type
    exemplars:
      enabled: false
#   	: 1000
    exclude_dimensions:
        - "collector_instance_id"
        - "otel_scope_name"
        - "job"
        - "exported_job"
    aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
    metrics_expiration: 5m
    events:
      enabled: true
      dimensions:
        - name: exception.type
        - name: exception.message
    resource_metrics_key_attributes:
      - service.name
#      - telemetry.sdk.language
#      - telemetry.sdk.name
      - w3.tracestate
 
service:
  pipelines:
    traces:
#      level: debug
      receivers: [otlp] 
      processors: [transform/timestamps]
 
      exporters: [debug,file/in,span_metrics,otlp_http] ##    endpoint: "http://0.0.0.0:4000"]
    metrics:
      receivers: [span_metrics]
      exporters: [file/b,prometheus]       
 
